<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 4px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: transparent;
    }
    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      padding: 20px 24px;
      border-radius: 14px;
      border: 1px solid #334155;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.12);
    }
    .hero h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      font-weight: 700;
      color: #38bdf8;
    }
    .hero p {
      margin: 10px 0 0 0;
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>🛰️ ISS Orbital Tracker &amp; Crew Monitor</h1>
    <div class="tags">
      <span class="tag">Team: Bugs</span>
      <span class="tag">Open-Notify API</span>
      <span class="tag">Pydantic • Pandas • SQLite</span>
    </div>
    <p>
      Real-time ETL pipeline tracking International Space Station live coordinates,
      orbital speed, flight path, and active astronauts in space.
    </p>
  </div>
</body>
</html>
