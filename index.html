<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISS Orbital Tracker - Team Bugs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b132b;
      color: #f8f9fa;
      margin: 0;
      padding: 24px;
    }
    .box {
      max-width: 720px;
      margin: auto;
      background: #1c2541;
      padding: 24px;
      border-radius: 10px;
      border: 1px solid #3a506b;
    }
    h1 { margin-top: 0; color: #5bc0be; }
    .badge {
      display: inline-block;
      background: #3a506b;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-right: 6px;
    }
    p { line-height: 1.6; color: #e0e1dd; }
  </style>
</head>
<body>
  <div class="box">
    <h1>ISS Orbital Tracker &amp; Crew Monitor</h1>
    <span class="badge">Team: Bugs</span>
    <span class="badge">Open-Notify API</span>
    <span class="badge">Python • Pydantic • Pandas • SQLite</span>
    <p>
      Real-time ETL pipeline tracking International Space Station coordinates, orbital speed,
      historical trajectory, and active crew members in space.
    </p>
  </div>
</body>
</html>
